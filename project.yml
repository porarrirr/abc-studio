name: ABCStudio
options:
  bundleIdPrefix: jp.porari
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
targets:
  ABCStudio:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: SoundFont
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.porari.abcstudio
        INFOPLIST_KEY_CFBundleDisplayName: ABC Studio
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SUPPORTS_MACCATALYST: NO
  ABCStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        TEST_TARGET_NAME: ABCStudio
        PRODUCT_BUNDLE_IDENTIFIER: jp.porari.abcstudio.uitests
schemes:
  ABCStudio:
    build:
      targets:
        ABCStudio: all
        ABCStudioUITests: [test]
    test:
      targets:
        - ABCStudioUITests
