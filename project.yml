name: ABCStudio
options:
  bundleIdPrefix: jp.porari
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  ABCStudio:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: SoundFont
        type: folder
      - path: Samples
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.porari.abcstudio
        INFOPLIST_FILE: Sources/Info.plist
        SUPPORTS_MACCATALYST: NO
  ABCStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ABCStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.porari.abcstudio.tests
        TEST_TARGET_NAME: ABCStudio
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ABCStudio.app/ABCStudio
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
  ABCStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    settings:
      base:
        TEST_TARGET_NAME: ABCStudio
        PRODUCT_BUNDLE_IDENTIFIER: jp.porari.abcstudio.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ABCStudio:
    build:
      targets:
        ABCStudio: all
        ABCStudioTests: [test]
        ABCStudioUITests: [test]
    test:
      targets:
        - ABCStudioTests
        - ABCStudioUITests
